apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: shop
  labels:
    app: catalog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
      - name: catalog
        image: shop/catalog:dev
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: catalog-config
        - secretRef:
            name: catalog-secret
        # Demonstration: Spring Boot property hierarchy.
        # Container args in K8s override both environment variables and application.yml!
        # args: ["--catalog.welcome-message=Overridden via K8s Pod Container Args!"]
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"
